<body>
<x-dc>
<helmet>
  <title>Events - Black Healing Centre</title>
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/tokens/colors.css">
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/tokens/typography.css">
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/tokens/effects.css">
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/styles.css">
  <script src="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <script src="https://app.arketa.co/scripts/embed.js"></script>
  <style>
    body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); }
    a { color: var(--bhc-terracotta); }
    a:hover { color: var(--bhc-espresso); }
  </style>
</helmet>
<dc-import name="Header" active-page="Events" hint-size="100%,72px"></dc-import>

<main>
  <section style="background: var(--surface-page);" data-screen-label="Events hero">
    <div style="max-width: var(--container-lg); margin: 0 auto; padding: 80px 28px 20px;">
      <x-import component-from-global-scope="BlackHealingCentreDesignSystem_43d3f9.SectionHeading" eyebrow="Calendar" title="Upcoming" accent="gatherings." size="xl" hint-size="auto,120px"></x-import>
      <div style="margin-top: 20px; max-width: 60ch; padding: 16px 20px; background: var(--surface-card); border-radius: var(--radius-md); border: 1px solid var(--border-soft);">
        <p style="margin: 0; font-size: 15px; color: var(--text-body); line-height: 1.6;">All sessions are <strong>sliding scale or free</strong>. No one is turned away. <a href="Donate.dc.html">Support access →</a></p>
      </div>
    </div>
  </section>

  <section style="background: var(--surface-page);" data-screen-label="Calendar">
    <div style="max-width: var(--container-lg); margin: 0 auto; padding: 30px 28px 60px;">
      <x-import component-from-global-scope="BlackHealingCentreDesignSystem_43d3f9.Card" tone="raised" padding="8px" hint-size="100%,900px" style="overflow: hidden;">
        <iframe id="sutraWidgetIframe" title="Black Healing Centre booking calendar" src="https://app.arketa.co/iframe/blackhealingcentre/calendar" width="100%" height="1000" style="border: none; border-radius: var(--radius-md); display: block;" allow="payment;fullscreen" allowfullscreen="true"></iframe>
      </x-import>
      <p style="margin: 16px 0 0; font-size: 14px; color: var(--text-muted); text-align: center;">Calendar not loading? <a href="https://app.arketa.co/blackhealingcentre/calendar" target="_blank" rel="noopener">Open the full schedule →</a></p>
    </div>
  </section>

  <section style="background: var(--surface-page);" data-screen-label="Past gatherings">
    <div style="max-width: var(--container-lg); margin: 0 auto; padding: 0 28px 70px;">
      <x-import component-from-global-scope="BlackHealingCentreDesignSystem_43d3f9.SectionHeading" eyebrow="Past gatherings" title="What it feels" accent="like to be here." size="lg" hint-size="auto,100px"></x-import>
      <div style="display: flex; justify-content: center; margin-top: 32px;">
        <image-slot id="events-photo-1" placeholder="Healing circle in session" shape="rounded" radius="20" style="width:100%;max-width:420px;height:240px;"></image-slot>
      </div>
    </div>
  </section>

  <section style="background: var(--surface-terracotta); color: var(--text-on-dark);" data-screen-label="Host">
    <div style="max-width: var(--container-md); margin: 0 auto; padding: 80px 28px; text-align: center;">
      <span style="font-family: var(--font-display); font-style: italic; font-size: 36px; line-height: 1.2; color: var(--bhc-ivory);">Want to host with us?</span>
      <p style="margin: 18px 0 28px; color: var(--bhc-bone); font-size: 17px;">We partner with community facilitators and artists year-round.</p>
      <a href="Partner.dc.html" style="text-decoration: none;"><x-import component-from-global-scope="BlackHealingCentreDesignSystem_43d3f9.Button" variant="secondary" size="lg" hint-size="180px,52px">Get in touch</x-import></a>
    </div>
  </section>
</main>

<dc-import name="Footer" hint-size="100%,340px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;showBookingCta&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Booking&quot;},
  &quot;bookingLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Reserve your spot&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Booking&quot;},
  &quot;accentTone&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Terracotta&quot;, &quot;options&quot;: [&quot;Terracotta&quot;, &quot;Fern&quot;, &quot;Sky&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Calendar&quot;}
}">

</body>
</html>
