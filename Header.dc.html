<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/tokens/colors.css">
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/tokens/typography.css">
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/tokens/effects.css">
  <link rel="stylesheet" href="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/styles.css">
  <script src="_ds/black-healing-centre-design-system-43d3f9d0-771a-49e3-85a0-c5466cdb4a4a/_ds_bundle.js"></script>
</helmet>
<header style="position: sticky; top: 0; z-index: 20; background: rgba(255,251,242,0.86); backdrop-filter: blur(10px); border-bottom: 1.5px solid var(--border-soft);">
  <div style="max-width: var(--container-lg); margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
    <a href="index.html" style="display: flex; text-decoration: none; flex-shrink: 0;">
      <x-import component-from-global-scope="BlackHealingCentreDesignSystem_43d3f9.Logo" layout="horizontal" size="{{ 40 }}" base="assets/logo/svg" color="Espresso" hint-size="180px,40px"></x-import>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display: flex; gap: 26px; align-items: center;">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="text-decoration: none; font-family: var(--font-sans); font-size: 15px; padding: 4px 0; color: {{ l.color }}; font-weight: {{ l.weight }}; white-space: nowrap;">{{ l.label }}</a>
        </sc-for>
      </nav>
    </sc-if>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <a href="Donate.dc.html" style="text-decoration: none; flex-shrink: 0;">
        <x-import component-from-global-scope="BlackHealingCentreDesignSystem_43d3f9.Button" variant="primary" size="sm" hint-size="100px,40px">Donate</x-import>
      </a>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="Menu" style="background: none; border: none; padding: 10px; margin: -10px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;">
        <span style="width: 22px; height: 2px; background: var(--text-strong); display: block;"></span>
        <span style="width: 22px; height: 2px; background: var(--text-strong); display: block;"></span>
        <span style="width: 22px; height: 2px; background: var(--text-strong); display: block;"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
    <nav style="display: flex; flex-direction: column; padding: 8px 28px 20px; background: var(--surface-page); border-bottom: 1.5px solid var(--border-soft); gap: 4px;">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" onClick="{{ closeMenu }}" style="text-decoration: none; font-family: var(--font-sans); font-size: 16px; padding: 12px 0; color: {{ l.color }}; font-weight: {{ l.weight }}; border-bottom: 1px solid var(--border-soft);">{{ l.label }}</a>
      </sc-for>
      <a href="Donate.dc.html" style="text-decoration: none; margin-top: 10px;">
        <x-import component-from-global-scope="BlackHealingCentreDesignSystem_43d3f9.Button" variant="primary" size="sm" full="{{ true }}" hint-size="100%,44px">Donate</x-import>
      </a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activePage&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;Home&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { isMobile: false, menuOpen: false };
  componentDidMount() {
    this._mq = window.matchMedia("(max-width: 860px)");
    this._onChange = (e) => this.setState({ isMobile: e.matches, menuOpen: e.matches ? this.state.menuOpen : false });
    this._onChange(this._mq);
    if (this._mq.addEventListener) this._mq.addEventListener("change", this._onChange);
    else this._mq.addListener(this._onChange);
  }
  componentWillUnmount() {
    if (!this._mq) return;
    if (this._mq.removeEventListener) this._mq.removeEventListener("change", this._onChange);
    else this._mq.removeListener(this._onChange);
  }
  renderVals() {
    const active = this.props.activePage || "Home";
    const items = [
      { label: "Home", href: "index.html" },
      { label: "Programs", href: "Programs.dc.html" },
      { label: "Events", href: "Events.dc.html" },
      { label: "About", href: "About.dc.html" },
      { label: "Partner", href: "Partner.dc.html" },
      { label: "Contact", href: "Contact.dc.html" },
    ];
    const links = items.map(i => ({
      ...i,
      weight: i.label === active ? 700 : 500,
      color: i.label === active ? "var(--text-accent)" : "var(--text-body)",
    }));
    return {
      links,
      isMobile: this.state.isMobile,
      isDesktop: !this.state.isMobile,
      showMobileMenu: this.state.isMobile && this.state.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>
